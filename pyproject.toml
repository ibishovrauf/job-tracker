[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-tracker"
version = "0.1.0"
description = "Local Werkstudent/Praktikum/Internship vacancy tracker for Germany"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlmodel>=0.0.14",
    "jinja2>=3.1",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "bs4>=0.0.2",
    "beautifulsoup4>=4.14.3",
    "python-multipart>=0.0.32",
]

[project.scripts]
job-tracker = "app.cli:main"

[project.optional-dependencies]
portals = ["playwright>=1.48"]
embeddings = [
    "numpy>=1.26",
    "torch>=2.2",
    "sentence-transformers>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
